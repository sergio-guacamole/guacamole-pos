<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15120e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Guacamole POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-screen tablet app. Rail de navegación + productos + cuenta a la derecha; en pantallas angostas todo se apila. Look único oscuro (plancha de cocina), por decisión. */
:root{
  color-scheme:dark;
  --bg:#15120e;        /* plancha */
  --panel:#1f1b16;
  --panel2:#29241e;
  --line:#3b342b;
  --fg:#f4ede2;
  --muted:#a99d8c;
  --cheddar:#f2b632;   /* acento */
  --cheddar-ink:#1b1408;
  --ketchup:#e0533a;   /* alerta / borrar */
  --pickle:#86b552;    /* éxito */
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cheddar);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;height:100%;box-sizing:border-box;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px;overflow:auto}
.brand{overflow-wrap:anywhere;hyphens:auto;font:700 14px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--cheddar);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;color:var(--muted);font:600 13px/1 var(--body)}
.rail button svg{width:26px;height:26px}
.rail button[aria-current="page"]{background:var(--panel2);color:var(--cheddar)}
.rail-cajon{margin-top:auto;color:var(--cheddar)!important}
.badge{position:absolute;top:4px;right:10px;min-width:20px;height:20px;border-radius:10px;background:var(--ketchup);color:#fff;font:700 12px/20px var(--body);text-align:center;padding:0 5px}
main{min-width:0;min-height:0;overflow:auto}

h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:32px}
h2{font-size:24px}
h3{font-size:19px}
.label{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Banner de estado */
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#3a1d16;border:1px solid var(--ketchup);color:var(--fg);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.banner.info{background:var(--panel2);border-color:var(--line);color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--cheddar);border-color:var(--cheddar);color:var(--cheddar-ink)}
.btn.go{background:var(--pickle);border-color:var(--pickle);color:#0f1a06}
.btn.danger{color:var(--ketchup);border-color:#5a2a20}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:64px;font:700 24px/1 var(--display);letter-spacing:.02em}

/* ---- Vender ---- */
.vender{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:16px;height:100%}
.catalog{min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none}
.tabs button{flex:none;padding:12px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:600 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--cheddar);border-color:var(--cheddar);color:var(--cheddar-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;overflow:auto;align-content:start;padding-bottom:8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:118px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.tile:active{transform:scale(.98)}
.tile .n{font:600 22px/1.05 var(--display);letter-spacing:.01em}
.tile .p{font:600 16px/1 var(--mono);color:var(--cheddar)}
.tile .p small{font:500 12px/1 var(--body);color:var(--muted);margin-right:4px}
.tile.off{opacity:.4}
.flag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--cheddar-ink);background:var(--cheddar);border-radius:4px;padding:3px 5px;margin-left:6px;vertical-align:middle}

.cart{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cart-h{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:10px 4px;border-radius:8px;font:600 15px/1 var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--cheddar)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields .wide{grid-column:1/-1}
.in{width:100%;box-sizing:border-box;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.in::placeholder{color:#6f6557}
.lines{flex:1;overflow:auto;padding:4px 14px;min-height:80px}
.empty{color:var(--muted);text-align:center;padding:32px 12px;line-height:1.5}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px}
.qty button{width:34px;height:36px;font:700 20px/1 var(--body);color:var(--cheddar)}
.qty span{min-width:22px;text-align:center;font:600 16px/1 var(--mono)}
.line .ln{font-weight:600;text-align:left;padding:0}
.line .ld{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.line .lp{font:600 15px/1.2 var(--mono);text-align:right}
.chip{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:#2c3a1d;color:var(--pickle);margin-top:4px}
.cart-f{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px;background:var(--panel2)}
.sum{display:flex;justify-content:space-between;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;font:700 34px/1 var(--display)}
.total .num{font-family:var(--mono);font-size:28px;color:var(--cheddar)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .full{grid-column:1/-1}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:14px;padding:4px 0;justify-self:start}

/* ---- Modal ---- */
.scrim{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet-b{overflow:auto;padding:20px;display:grid;gap:18px}
.sheet-f{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.sheet-f .grow{flex:1}
.grp{display:grid;gap:10px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.req{font:600 12px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--cheddar)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:left;font-weight:600}
.opt small{font:500 14px/1 var(--mono);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--cheddar);background:#3a2e14}
.opt[aria-pressed="true"] small{color:var(--cheddar)}
.opt.quit[aria-pressed="true"]{border-color:var(--ketchup);background:#3a1d16}
.stepper{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px}
.stepper button{width:48px;height:48px;font:700 24px/1 var(--body);color:var(--cheddar)}
.stepper span{min-width:28px;text-align:center;font:600 20px/1 var(--mono)}
.paybig{font:700 52px/1 var(--mono);color:var(--cheddar);text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.cambio{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:10px;background:var(--bg)}
.cambio b{font:700 30px/1 var(--mono)}
.pre-wrap{overflow:auto;max-height:52vh;background:#f6f1e6;color:#1d1a15;border-radius:6px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.ticket{font:13px/1.35 var(--mono);white-space:pre;margin:0}

/* ---- Vistas de lista ---- */
.page{display:grid;gap:16px;align-content:start;padding-bottom:16px}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;text-align:left}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .amt{font:600 22px/1 var(--mono);color:var(--cheddar)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .v{font:600 30px/1.1 var(--mono);color:var(--fg)}
.kpi .v.acc{color:var(--cheddar)}
.tk-ed{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:20px;align-items:start}@media(max-width:900px){.tk-ed{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:18px;overflow-x:auto}
.bar{flex:1 0 26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:100%;background:var(--cheddar);border-radius:4px 4px 0 0;min-height:2px}
.bar i.zero{background:var(--line)}
.bar b{font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.bar span{font:600 12px/1 var(--body);color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--cheddar)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.anulada td{color:var(--muted);text-decoration:line-through}
tr.anulada td:last-child{text-decoration:none}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font:600 12px/1.2 var(--body);background:var(--panel2);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--cheddar)}
.mrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(80px,1fr)) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.orow{display:grid;grid-template-columns:minmax(0,2fr) minmax(80px,1fr) auto;gap:8px;align-items:center}
.plato-h{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--cheddar);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.ctabs{display:flex;flex-wrap:wrap;gap:6px}
.ctabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;line-height:1.1}
.ctabs button b{font:600 12px/1 var(--mono);color:var(--cheddar)}
.ctabs button[aria-pressed="true"]{border-color:var(--cheddar);background:#3a2e14}
.mesas{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mesa-b{min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.mesa-b small{font:600 11px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ketchup)}
.mesa-b[data-ocupada]{border-color:#5a2a20;background:#2a1712}
.mesa-b[aria-pressed="true"]{border-color:var(--cheddar);background:#3a2e14;color:var(--cheddar)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-sizing:border-box}

@media (max-width:860px){
  .vender{grid-template-columns:minmax(0,1fr);height:auto}
  .grid{overflow:visible}
  .cart{min-height:420px}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{flex-direction:row;order:2;padding:6px;justify-content:space-around}
  .brand{display:none}
  .rail button{flex:1;padding:8px 2px}
  .mrow{grid-template-columns:1fr 1fr}
  .mrow .in:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.tile:active{transform:none}}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail" aria-label="Secciones"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ===================== Datos base ===================== */
const O=(n,p=0)=>({n,p});
const DEFAULT_MENU={
  cats:[{id:'hamb',n:'Hamburguesas'},{id:'esp',n:'Especialidades'},{id:'hotdog',n:'Hot dogs'},{id:'alitas',n:'Alitas y boneless'},{id:'snacks',n:'Snacks'},{id:'beb',n:'Bebidas'},{id:'postres',n:'Postres y café'}],
  grupos:{
    extH:{n:'Extras',t:'extra',min:0,max:10,o:[O('Aguacate',10),O('Piña',10),O('Queso cheddar',5),O('Queso manchego',5),O('Tocino',10),O('Cebolla caramelizada',5)]},
    quitH:{n:'Quitar ingredientes',t:'quitar',min:0,max:10,o:[O('Cebolla'),O('Jitomate'),O('Lechuga'),O('Queso')]},
    salsa:{n:'Salsa',t:'salsa',min:1,max:2,o:[O('Ajo parmesano'),O('BBQ'),O('BBQ chipotle'),O('BBQ picante'),O('Búfalo'),O('Lemon pepper'),O('Lemon pepper hot'),O('Mango habanero'),O('Mezcal'),O('Naranja chipotle'),O('Red hot')]},
    aderezo:{n:'Aderezo',t:'aderezo',min:0,max:1,o:[O('Blue cheese'),O('Ranch'),O('Ranch habanero')]},
    quitW:{n:'Quitar',t:'quitar',min:0,max:5,o:[O('Apio'),O('Zanahoria')]},
    extW:{n:'Extras',t:'extra',min:0,max:5,o:[O('Papas 1/2 orden',10),O('Promo refresco',15)]}
  },
  prods:[
    {id:'wagyu',c:'hamb',n:'Carne wagyu',p:30,on:true},
    {id:'clasica',c:'hamb',n:'Hamburguesa Clásica',d:'120 g de res, queso americano, cebolla, jitomate y lechuga',pres:[O('Normal',90),O('Con papas',110)],g:['extH','quitH'],on:true},
    {id:'pina',c:'hamb',n:'Hamburguesa Piña',pres:[O('Normal',100),O('Con papas',120)],g:['extH','quitH'],on:true},
    {id:'tocino',c:'hamb',n:'Hamburguesa Tocino',d:'Carne, 2 tiras de tocino, queso americano, lechuga, cebolla y jitomate',pres:[O('Normal',100),O('Con papas',120)],g:['extH','quitH'],on:true},
    {id:'carnex',c:'esp',n:'Carne extra',p:30,on:true},
    {id:'tresq',c:'esp',n:'Hamburguesa 3 quesos jalapeño',pres:[O('Normal',140),O('Con papas',160)],g:['extH','quitH'],on:true},
    {id:'h350',c:'esp',n:'Hamburguesa 350',pres:[O('Normal',180),O('Con papas',200)],g:['extH','quitH'],on:true},
    {id:'cheddar',c:'esp',n:'Hamburguesa Bañada en Cheddar',d:'Queso gouda, cebolla, jitomate y lechuga, bañada en salsa de queso cheddar',pres:[O('Normal',120),O('Con papas',140)],g:['extH','quitH'],on:true},
    {id:'hboneless',c:'esp',n:'Hamburguesa Boneless',d:'Boneless en tu salsa, ranch, queso americano, tocino, jitomate, cebolla y lechuga',pres:[O('Normal',125),O('Con papas',145)],g:['salsa','extH','quitH'],on:true},
    {id:'brava',c:'esp',n:'Hamburguesa Brava',d:'Chicharrón de habanero, tocino, queso amarillo, cebolla, jitomate y lechuga',pres:[O('Normal',120),O('Con papas',140)],g:['extH','quitH'],on:true},
    {id:'croissant',c:'esp',n:'Hamburguesa Croissant',pres:[O('Normal',165),O('Con papas',185)],g:['extH','quitH'],on:true},
    {id:'mermelada',c:'esp',n:'Hamburguesa Mermelada de Tocino',d:'Queso americano, cebolla, jitomate y lechuga con mermelada de tocino',pres:[O('Normal',145),O('Con papas',165)],g:['extH','quitH'],on:true},
    {id:'popper',c:'esp',n:'Hamburguesa Popper',d:'Queso gouda, cebolla, jitomate y lechuga con jalapeños rellenos de queso',pres:[O('Normal',140),O('Con papas',160)],g:['extH','quitH'],on:true},
    {id:'provo',c:'esp',n:'Hamburguesa Provolone',d:'Con slices de queso provolone',pres:[O('Normal',175),O('Con papas',195)],g:['extH','quitH'],on:true},
    {id:'oklahoma',c:'esp',n:'Oklahoma Burger',d:'Doble carne, queso americano, cebolla caramelizada, jitomate y lechuga',pres:[O('Normal',150),O('Con papas',170)],g:['extH','quitH'],on:true},
    {id:'western',c:'esp',n:'Western Burger',d:'Queso americano, aros de cebolla, jitomate, lechuga y salsa BBQ',pres:[O('Normal',125),O('Con papas',145)],g:['extH','quitH'],on:true},
    {id:'hotdog',c:'hotdog',n:'Hot Dog',d:'Salchicha estilo alemana, clásica o picante',p:75,on:true},
    {id:'hotdogt',c:'hotdog',n:'Hot dog con tocino',p:55,on:true},
    {id:'hotdoge',c:'hotdog',n:'Hot Dog Especial',p:85,on:true},
    {id:'hotdogr',c:'hotdog',n:'Hot Dog res',p:55,on:true},
    {id:'medbon',c:'alitas',n:'1/2 boneless',p:80,g:['salsa','aderezo'],on:true},

  },
  all(c){return new Promise(res=>{if(!this.idb)return res({});const out={};try{const rq=this.idb.transaction(c,'readonly').objectStore(c).openCursor();
    rq.onsuccess=()=>{const cur=rq.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res(out)}})},
  put(c,id,v){return new Promise((res,rej)=>{if(!this.idb)return res();try{const tx=this.idb.transaction(c,'readwrite'),st=tx.objectStore(c);

  fire(c){(this.subs[c]||[]).forEach(f=>f())},

const CP850={'á':0xA0,'é':0x82,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'¿':0xA8,'¡':0xAD,'Á':0xB5,'É':0x90,'Í':0xD6,'Ó':0xE0,'Ú':0xE9,'ü':0x81,'Ü':0x9A};

function wrap(s,w){s=asc(s);const out=[];let cur='';for(const word of s.split(' ')){if((cur+' '+word).trim().length>w){if(cur)out.push(cur);cur=word}else cur=(cur+' '+word).trim()}if(cur)out.push(cur);return out.length?out:['']}
function Doc(w){
  const b=[],pv=[];let big=false,al='l';
  const cw=()=>big?Math.floor(w/2)-1:w-1;
  const self={
    init(){b.push(27,64,27,116,2);return self},
    align(a){al=a;b.push(27,97,{l:0,c:1,r:2}[a]);return self},
    bold(on){b.push(27,69,on?1:0);return self},
    size(on){big=!!on;b.push(29,33,on?0x11:0);return self},
    line(s=''){s=asc(s);for(const ch of s)b.push(CP850[ch]??ch.charCodeAt(0));b.push(10);
      const c=cw(),k=big?2:1,pad=al==='c'?Math.max(0,Math.floor((c-s.length)/2)):al==='r'?Math.max(0,c-s.length):0;pv.push(' '.repeat(pad*k)+(big?s.toUpperCase():s));return self},
    para(s,indent=''){wrap(s,cw()-indent.length).forEach(x=>self.line(indent+x));return self},
    lr(l,r){l=asc(l);r=asc(r);const c=cw();
      if(l.length+r.length+1>c){wrap(l,c).forEach(x=>self.line(x));return self.line(' '.repeat(Math.max(0,c-r.length))+r)}
      return self.line(l+' '.repeat(c-l.length-r.length)+r)},
    rule(ch='-'){return self.line(ch.repeat(cw()))},
    feed(n=3){b.push(27,100,n);for(let i=0;i<n;i++)pv.push('');return self},
    cut(){b.push(29,86,66,0);pv.push('- - - - - - - corte - - - - - - -');return self},
    image(img){if(!img||!img.b64)return self;const bin=atob(img.b64),bw=img.w/8;b.push(29,118,48,0,bw%256,Math.floor(bw/256),img.h%256,Math.floor(img.h/256));for(let i=0;i<bin.length;i++)b.push(bin.charCodeAt(i));b.push(10);pv.push('\u0001LOGO');return self},
    drawer(){b.push(27,112,0,25,250);pv.push('[ se abre el cajón ]');return self},
    qr(text,size=6){const d=[...new TextEncoder().encode(text)],n=d.length+3;
      b.push(29,40,107,4,0,49,65,50,0, 29,40,107,3,0,49,67,size, 29,40,107,3,0,49,69,49, 29,40,107,n%256,Math.floor(n/256),49,80,48,...d, 29,40,107,3,0,49,81,48,10);
      const c=cw();['┌────────┐','│   QR   │','│  reseña│','└────────┘'].forEach(x=>pv.push(' '.repeat(Math.max(0,Math.floor((c-10)/2)))+x));return self},
    url(){let bin='';for(const x of b)bin+=String.fromCharCode(x);
      return 'intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'},
    preview(){return pv.join('\n')}
  };
  return self;
}
const fechaLarga=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+', '+d.getDate()+'/'+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]+'/'+d.getFullYear()};

function buildTicket(v,{cajon=false,copia=false,aj=null}={}){
  const a={...DEFAULT_AJ,...(aj||S.aj)},d=Doc(+a.ancho||48).init();
  if(cajon)d.drawer();

  String(a.encab||'').split('\n').filter(x=>x.trim()).forEach(x=>d.para(x));
  if(a.tFolio!==false)d.line('Folio: '+v.folio);
  d.line(fechaLarga(t));
  if(a.dir&&a.tDir!==false)d.para(a.dir);
  if(a.tel&&a.tTel!==false)d.line('Tel. / WhatsApp: '+a.tel);
  if(v.tipo==='mesa')d.line('Mesa: '+(v.mesa||'-'));
  if(a.tTipo!==false)d.line(TIPOS[v.tipo]);
  if(v.tipo==='pedido'){
    if(v.cliente?.nombre)d.para('Cliente: '+v.cliente.nombre);
    if(v.cliente?.tel)d.line('Tel: '+v.cliente.tel);
    if(v.cliente?.dir)d.para('Entrega: '+v.cliente.dir);
  }
  if(copia)d.bold(1).line('*** COPIA ***').bold(0);
  d.line('').align('l').rule();
  v.items.forEach(l=>{
    d.lr(l.qty+' '+l.n,money(l.base*l.qty));
    if(l.pres)d.line('   '+l.pres);
    if(l.regalo)d.line('   Regalo por fidelidad');
    (l.mods||[]).forEach(m=>{if(m.t==='extra'||+m.p)d.lr('   + '+m.n,+m.p?money(m.p*l.qty):'')});
  });
  d.rule().align('r');
  if(v.tipo==='pedido'&&+v.envio){d.line('Subtotal: '+money(subtotal(v)));d.line('Envio: '+money(v.envio))}
  d.bold(1).size(1).line('Total: '+money(v.total)).size(0).bold(0);
  if(v.pago){
    d.line('Pago: '+(METODOS[v.pago.metodo]||v.pago.metodo)+(v.pago.metodo==='efectivo'&&v.pago.recibido?' '+money(v.pago.recibido):''));
    if(v.pago.metodo==='efectivo'&&v.pago.recibido)d.line('Cambio: '+money(v.pago.cambio));
  }
  d.line('').align('c');
  if(v.fid){const f=v.fid,falta=(f.meta-1)-f.sellos;
    d.rule().bold(1).line('Programa de lealtad').bold(0);
    if(v.cliente?.nombre)d.para(v.cliente.nombre);
    const pn=premioN(a);
    if(f.canje)d.bold(1).para('¡Disfruta tu '+pn+' de regalo!').bold(0);
    else if(falta<=0)d.bold(1).para('¡En tu próxima visita te regalamos: '+pn+'!').bold(0);
    else d.para('Llevas '+f.sellos+' sello'+(f.sellos===1?'':'s')+'. Te faltan '+falta+' para tu '+pn+' gratis.');
    if(!f.cuenta&&!f.canje)d.para('(Compras desde '+money(a.minSello)+' suman sello)');
    d.rule();}
  if(telKey(v.cliente?.tel)&&a.avisoCorto){d.para(a.avisoCorto);d.line('')}
  if(a.pie)d.bold(1).size(1).para(a.pie).size(0).bold(0);
  String(a.pieExtra||'').split('\n').filter(x=>x.trim()).forEach(x=>d.para(x));
  if(a.qr&&a.qrUrl&&!copia){d.line('').line('¿Cómo te fue? Déjanos tu opinión').line('en Google, nos ayuda mucho').qr(a.qrUrl)}
  d.feed(3).cut();
  return d;
}

function procLogo(src,ancho,esc){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{

/* ---------- Reportes ---------- */
const d0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d};
function rango(r){
  const a=d0(Date.now()),b=new Date(a);b.setDate(b.getDate()+1);
  if(r==='ayer'){a.setDate(a.getDate()-1);b.setDate(b.getDate()-1)}
  if(r==='semana')a.setDate(a.getDate()-((a.getDay()+6)%7));
  if(r==='mes')a.setDate(1);
  return[a.getTime(),b.getTime()];
}
function vReportes(){
  const [A,B]=rango(S.rango);
  const enR=S.ventas.filter(v=>v.pagada>=A&&v.pagada<B).sort((a,b)=>b.pagada-a.pagada);
  const ok=enR.filter(v=>v.estado!=='anulada');
  const tot=r2(ok.reduce((a,v)=>a+v.total,0));
  const byM=Object.fromEntries(Object.keys(METODOS).map(k=>[k,0]));ok.forEach(v=>byM[v.pago?.metodo]=(byM[v.pago?.metodo]||0)+v.total);
  const byT={mostrador:0,mesa:0,pedido:0};ok.forEach(v=>byT[v.tipo]=(byT[v.tipo]||0)+v.total);
  const prodAgg={};ok.forEach(v=>v.items.forEach(l=>{const k=l.n;prodAgg[k]=prodAgg[k]||{q:0,m:0};prodAgg[k].q+=l.qty;prodAgg[k].m+=lineTotal(l)}));
  const top=Object.entries(prodAgg).sort((a,b)=>b[1].m-a[1].m).slice(0,8);
  // serie
  let serie=[];
  if(S.rango==='hoy'||S.rango==='ayer'){
    for(let hh=11;hh<=23;hh++)serie.push({l:hh+'',v:0});
    ok.forEach(v=>{const hh=new Date(v.pagada).getHours();const s=serie.find(x=>+x.l===hh);if(s)s.v+=v.total});
  }else{
    const dias=['L','M','M','J','V','S','D'];
    for(let t=A;t<Math.min(B,d0(Date.now()).getTime()+864e5);t+=864e5){const d=new Date(t);serie.push({l:S.rango==='semana'?dias[(d.getDay()+6)%7]:d.getDate()+'',k:d0(t).getTime(),v:0})}
    ok.forEach(v=>{const k=d0(v.pagada).getTime();const s=serie.find(x=>x.k===k);if(s)s.v+=v.total});
  }
  const mx=Math.max(1,...serie.map(s=>s.v));
  const hb=(obj,lab)=>{const m=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>`<div class="hbar"><span>${lab[k]||k}</span><span class="num">${money(v)}</span><div class="track"><i style="width:${(v/m*100).toFixed(1)}%"></i></div></div>`).join('')};
  // corte de hoy
  const [hA,hB]=rango('hoy');
  const hoyEf=r2(S.ventas.filter(v=>v.estado!=='anulada'&&v.pagada>=hA&&v.pagada<hB&&v.pago?.metodo==='efectivo').reduce((a,v)=>a+v.total,0));
  const esperado=r2((+S.fondo||0)+hoyEf+movNet());
  const dif=S.contado===''?null:r2((+S.contado||0)-esperado);
  const chips=[['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['mes','Este mes']];
  return `<div class="page">${banner()}
    <div class="page-h"><h1>Reportes</h1>
      <div class="tabs" role="group" aria-label="Rango">${chips.map(([k,t])=>`<button data-act="rango" data-r="${k}" aria-pressed="${S.rango===k}">${t}</button>`).join('')}</div></div>
    ${!S.loaded?`<div class="banner info">Cargando ventas…</div>`:''}
    <div class="kpis">
      <div class="panel kpi"><span class="label">Venta</span><span class="v acc num">${money(tot)}</span></div>
      <div class="panel kpi"><span class="label">Tickets</span><span class="v num">${ok.length}</span></div>
      <div class="panel kpi"><span class="label">Ticket promedio</span><span class="v num">${money(ok.length?tot/ok.length:0)}</span></div>
    </div>
    <div class="panel"><div class="page-h"><h3>${S.rango==='hoy'||S.rango==='ayer'?'Venta por hora':'Venta por día'}</h3></div>
      <div class="bars">${serie.map(s=>`<div class="bar" title="${money(s.v)}">${s.v?`<b>${s.v>=1000?(s.v/1000).toFixed(1)+'k':Math.round(s.v)}</b>`:''}<i class="${s.v?'':'zero'}" style="height:${(s.v/mx*130).toFixed(0)}px"></i><span>${s.l}</span></div>`).join('')}</div></div>
    <div class="two">
      <div class="panel"><h3>Por forma de pago</h3>${hb(byM,METODOS)}</div>
      <div class="panel"><h3>Por tipo de venta</h3>${hb(byT,TIPOS)}</div>
    </div>
    <div class="panel"><h3>Lo más vendido</h3>
      ${top.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th class="r">Piezas</th><th class="r">Importe</th></tr></thead><tbody>
      ${top.map(([n,x])=>`<tr><td>${h(n)}</td><td class="r num">${x.q}</td><td class="r num">${money(x.m)}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="muted">Sin ventas en este rango.</p>`}</div>
    <div class="panel"><div class="page-h"><h3>Corte de caja de hoy</h3><span class="muted">Efectivo cobrado hoy: <b class="num">${money(hoyEf)}</b></span></div>
      <div class="form">
        <label><span class="label">Fondo inicial</span><input class="in num" id="fondo" data-r="fondo" inputmode="decimal" placeholder="$0.00" value="${h(S.fondo)}"></label>
        <label><span class="label">Efectivo contado</span><input class="in num" id="contado" data-r="contado" inputmode="decimal" placeholder="$0.00" value="${h(S.contado)}"></label>
        <div class="grp"><span class="label">Debe haber</span><span class="num" style="font:600 26px/1.3 var(--mono)" id="esperado">${money(esperado)}</span></div>
        <div class="grp"><span class="label">Diferencia</span><span class="num" id="dif" style="font:600 26px/1.3 var(--mono);color:${dif===null?'var(--muted)':dif<0?'var(--ketchup)':'var(--pickle)'}">${dif===null?'—':(dif>0?'+':'')+money(dif)}</span></div>
      </div>
      <div><button class="btn primary" data-act="corte">Guardar corte e imprimir</button></div>
      ${S.cortes.length?`<div class="tablewrap"><table><thead><tr><th>Corte</th><th class="r">Ventas</th><th class="r">Efectivo esperado</th><th class="r">Contado</th><th class="r">Diferencia</th></tr></thead><tbody>
        ${[...S.cortes].sort((a,b)=>b.t-a.t).slice(0,5).map(c=>`<tr><td>${fecha(c.t)} ${hora(c.t)}</td><td class="r num">${money(c.venta)}</td><td class="r num">${money(c.esperado)}</td><td class="r num">${money(c.contado)}</td><td class="r num">${money(c.dif)}</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>
    ${(()=>{const bl=S.bit.filter(x=>x.t>=A&&x.t<B).sort((a,b)=>b.t-a.t);return `<div class="panel"><div class="page-h"><h3>Cancelaciones y acciones con PIN</h3><span class="muted">${bl.length}</span></div>
      ${bl.length?`<div class="tablewrap"><table><thead><tr><th>Hora</th><th>Acción</th><th>Detalle</th><th>Motivo</th><th class="r">Monto</th></tr></thead><tbody>
      ${bl.map(x=>`<tr><td class="num">${S.rango==='hoy'||S.rango==='ayer'?'':fecha(x.t)+' '}${hora(x.t)}</td><td>${h(x.accion)}${x.folio?' #'+x.folio:''}</td><td>${h(x.detalle||'')}</td><td>${h(x.motivo||'—')}</td><td class="r num">${x.monto?money(x.monto):''}</td></tr>`).join('')}</tbody></table></div>`
      :'<p class="muted" style="margin:0">Sin cancelaciones en este rango.</p>'}</div>`})()}
    <div class="panel"><div class="page-h"><h3>Tickets</h3><button class="btn small" data-act="csv" ${enR.length?'':'disabled'}>Descargar Excel (CSV)</button></div>
      ${enR.length?`<div class="tablewrap"><table><thead><tr><th>Folio</th><th>Hora</th><th>Venta</th><th>Pago</th><th class="r">Total</th><th></th></tr></thead><tbody>
      ${enR.map(v=>`<tr class="${v.estado==='anulada'?'anulada':''}"><td class="num">#${v.folio}</td><td class="num">${S.rango==='hoy'||S.rango==='ayer'?'':fecha(v.pagada)+' '}${hora(v.pagada)}</td><td>${h(ordenLabel(v))}</td><td>${METODOS[v.pago?.metodo]||'-'}</td><td class="r num">${money(v.total)}</td>
        <td class="r" style="white-space:nowrap">${v.estado==='anulada'?'<span class="pill">Anulada</span>':S.anular===v.id
          ?`<button class="btn small danger" data-act="anular-si" data-id="${v.id}">Sí, anular</button> <button class="btn small" data-act="anular-no">No</button>`
          :`<button class="btn small" data-act="reimp" data-id="${v.id}">Reimprimir</button> <button class="btn small danger" data-act="anular" data-id="${v.id}">Anular</button>`}</td></tr>`).join('')}
      </tbody></table></div>`:`<p class="muted">Aún no hay ventas en este rango. Cobra la primera desde Vender.</p>`}
    </div></div>`;
}

/* ---------- Caja ---------- */
function movNet(){const [A,B]=rango('hoy');return r2(S.movs.filter(m=>m.t>=A&&m.t<B).reduce((x,m)=>x+(m.tipo==='entrada'?1:-1)*(+m.monto||0),0))}
function vCaja(){
  const [A,B]=rango(S.rango);
  const ok=S.ventas.filter(v=>v.estado!=='anulada'&&v.pagada>=A&&v.pagada<B);
  const tot=r2(ok.reduce((x,v)=>x+v.total,0));
  const cards=Object.entries(METODOS).map(([k,n])=>{const vs=ok.filter(v=>v.pago?.metodo===k);const s=r2(vs.reduce((x,v)=>x+v.total,0));
    return `<div class="card"><span class="label">${n}</span><span class="amt num">${money(s)}</span><span class="muted">${vs.length} ticket${vs.length===1?'':'s'}${tot?` · ${Math.round(s/tot*100)}%`:''}</span></div>`}).join('');
  const movs=S.movs.filter(m=>m.t>=A&&m.t<B).sort((a,b)=>b.t-a.t);
  const chips=[['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['mes','Este mes']];
  return `<div class="page">${banner()}
    <div class="page-h"><h1>Caja</h1><button class="btn primary" data-act="cajon">${svg('abrir').replace('<svg','<svg width="20" height="20"')} Abrir cajón</button></div>
    <div class="page-h"><div class="tabs" role="group" aria-label="Rango">${chips.map(([k,t])=>`<button data-act="rango" data-r="${k}" aria-pressed="${S.rango===k}">${t}</button>`).join('')}</div>
      <span class="muted">Total cobrado: <b class="num" style="color:var(--cheddar)">${money(tot)}</b></span></div>
    <div class="cards">${cards}</div>
    <div class="panel"><h3>Entradas y salidas de efectivo</h3>
      <p class="muted" style="margin:0">Registra cuando sacas dinero de la caja (pago a proveedor, compras) o metes cambio. Se descuenta del corte y abre el cajón.</p>
      <div class="form">
        <div class="seg" role="group" aria-label="Tipo de movimiento" style="grid-template-columns:1fr 1fr;align-self:end">${[['salida','Salida'],['entrada','Entrada']].map(([k,t])=>`<button data-act="movtipo" data-t="${k}" aria-pressed="${S.movTipo===k}">${t}</button>`).join('')}</div>
        <label><span class="label">Monto</span><input class="in num" id="mov-monto" inputmode="decimal" placeholder="$0.00"></label>
        <label><span class="label">Concepto</span><input class="in" id="mov-con" placeholder="Ej. pago de pan Bimbo"></label>
        <div style="align-self:end"><button class="btn primary" data-act="mov">Guardar y abrir cajón</button></div>
      </div>
      ${movs.length?`<div class="tablewrap"><table><thead><tr><th>Hora</th><th>Concepto</th><th>Tipo</th><th class="r">Monto</th></tr></thead><tbody>
        ${movs.map(m=>`<tr><td class="num">${S.rango==='hoy'||S.rango==='ayer'?'':fecha(m.t)+' '}${hora(m.t)}</td><td>${h(m.concepto)}</td><td>${m.tipo==='entrada'?'Entrada':'Salida'}</td><td class="r num" style="color:${m.tipo==='entrada'?'var(--pickle)':'var(--ketchup)'}">${m.tipo==='entrada'?'+':'−'}${money(m.monto)}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="muted" style="margin:0">Sin movimientos en este rango.</p>`}
    </div></div>`;
}

/* ---------- Clientes y lealtad ---------- */
const telKey=s=>{const d=String(s||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):''};
const cliente=tel=>S.clientes.find(c=>c.id===tel);
function fidHTML(o){
  const tel=telKey(o.cliente.tel);if(!tel)return '';
  const pr=o.cliente.promos??cliente(tel)?.promos??false;
  const promo=`<label class="check" style="min-height:32px;font-size:14px"><input type="checkbox" id="f-promo" data-ck="promos" ${pr?'checked':''}>Acepta promociones por WhatsApp</label>`;
  if(!S.aj.fid)return `<div style="padding:4px 12px;border-radius:10px;background:var(--bg)">${promo}</div>`;
  const c=cliente(tel),meta=+S.aj.meta||8,s=+(c?.sellos)||0,toca=s>=meta-1,ya=o.items.some(l=>l.regalo);
  const dots=Array.from({length:meta-1},(_,i)=>`<i style="display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;background:${i<s?'var(--cheddar)':'var(--line)'}"></i>`).join('');
  return `<div style="display:grid;gap:6px;padding:10px 12px;border-radius:10px;background:var(--bg);margin-top:2px">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${c?h(c.nombre||'Cliente')+' · '+c.visitas+' visita'+(c.visitas===1?'':'s'):'Cliente nuevo'}</span><span>${dots}</span></div>
    ${toca?(ya?'<span class="chip">Regalo agregado</span>':`<button class="btn go small" data-act="regalo">🎁 ${meta}ª compra: agregar ${h(premioN())} gratis</button>`)
      :`<span class="muted" style="font-size:13px">${s} de ${meta-1} sellos · en la ${meta}ª compra se regala: ${h(premioN())}</span>`}${promo}</div>`;
}

    :`<div class="panel empty">${S.clientes.length?'Ningún cliente coincide con la búsqueda.':'Aún no hay clientes. Escribe el teléfono del cliente al vender y aquí aparecerá con sus visitas y sellos.'}</div>`}
  </div>`;

/* ---------- Ajustes ---------- */

  return `<div class="page">${banner()}<div class="page-h"><h1>Ajustes</h1><button class="btn primary" data-act="aj-save">Guardar ajustes</button></div>

function stepsTxt(g){const s=g.steps||[];const parts=[];s.forEach((v,i)=>parts.push(`${i+1}º ${+v?'+'+money(v):'incluido'}`));parts.push(`más +${money(g.extra||0)} c/u`);return parts.join(', ')}
function stepPrice(g,i){return g.steps?(i<g.steps.length?+g.steps[i]:+(g.extra||0)):+(g.o[i]?.p||0)}
function sheetUnit(m){
  const p=prod(m.pid);let u=p.pres?(m.pres==null?0:+p.pres[m.pres].p):+p.p;const base=u;
  for(const [gid,sel] of Object.entries(m.sel)){const g=grupo(gid);if(!g)continue;
    if(g.mode==='max'){if(sel.length)u+=Math.max(0,Math.max(...sel.map(j=>+g.o[j]?.p||0))-base)}
    else sel.forEach((j,i)=>u+=g.steps?stepPrice(g,i):(+g.o[j]?.p||0))}
  return r2(u);
}
function closeModal(){const m=S.modal;S.modal=null;renderModal();if(m&&m.then)m.then()}

/* ===================== Acciones ===================== */
function addFromSheet(m){
  const p=prod(m.pid);
  for(const gid of (p.g||[])){const g=grupo(gid);if(g&&g.min&&(m.sel[gid]||[]).length<g.min){toast('Elige '+g.n.toLowerCase());return false}}
  if(p.pres&&m.pres==null){toast('Elige la presentación');return false}
  const mods=[];
  const base0=p.pres?+p.pres[m.pres].p:+p.p;
  for(const gid of (p.g||[])){const g=grupo(gid);if(!g)continue;const sl=m.sel[gid]||[];
    if(g.mode==='max'){const mx=sl.length?Math.max(...sl.map(j=>+g.o[j]?.p||0)):0;sl.forEach((j,i)=>{const x=g.o[j];if(x)mods.push({t:g.t,n:x.n,p:i===0?Math.max(0,mx-base0):0,g:g.n})});continue}
    sl.forEach((j,i)=>{const x=g.o[j];if(x&&!(g.def===j&&!+x.p))mods.push({t:g.t,n:x.n,p:g.steps?stepPrice(g,i):(+x.p||0),g:g.n})})}
  const prevPlato=m.edit?S.orden.items.find(l=>l.uid===m.edit)?.plato:(S.orden.tipo==='mesa'?(S.orden.plato||1):undefined);
  const line={plato:prevPlato,uid:m.edit||uid(),pid:p.id,n:p.n,pres:p.pres?p.pres[m.pres].n:null,base:p.pres?+p.pres[m.pres].p:+p.p,mods,nota:m.nota.trim(),qty:m.qty,enviado:false,sel:m.sel,presIdx:m.pres};
  const it=S.orden.items;
  if(m.edit){const i=it.findIndex(l=>l.uid===m.edit);if(i>=0)it[i]=line}else{
    const same=it.find(l=>!l.regalo&&!l.enviado&&l.plato===line.plato&&l.pid===line.pid&&l.pres===line.pres&&!l.nota&&!line.nota&&JSON.stringify(l.mods)===JSON.stringify(line.mods));
    if(same)same.qty+=line.qty;else it.push(line);
  }
  return true;
}
function platoBar(o){const mx=Math.max(1,o.plato||1,...o.items.map(l=>l.plato||1));const cur=o.plato||1;
  return `<div class="ctabs" role="group" aria-label="Plato o persona"><span class="label" style="align-self:center">Agregar a</span>${Array.from({length:mx},(_,i)=>i+1).map(n=>`<button data-act="plato" data-n="${n}" aria-pressed="${cur===n}">Plato ${n}</button>`).join('')}<button data-act="plato" data-n="${mx+1}">＋ Plato</button></div>`}
function ctasLlevar(o){
  const ab=S.cuentas.filter(c=>c.tipo==='mostrador').sort((a,b)=>a.abierta-b.abierta);
  if(!ab.length&&!o.guardada)return '';
  return `<div class="ctabs" role="group" aria-label="Cuentas para llevar abiertas">${ab.map(c=>`<button data-act="vcta" data-id="${c.id}" aria-pressed="${c.id===o.id}">#${c.folio}${c.cliente?.nombre?' '+h(c.cliente.nombre):''}<b class="num">${money(totalOf(c))}</b></button>`).join('')}
    <button data-act="nueva" aria-pressed="${!o.guardada}">＋ Nueva</button></div>`;
}
async function guardarActual(){const o=S.orden;if(o.guardada||o.items.length){if(o.tipo==='mesa'&&!validOrden(o))return false;try{await saveCuenta(o)}catch(e){return false}}return true}
async function sha(s){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gg-pos:'+s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let x=0;for(const c of 'gg-pos:'+s)x=(x*31+c.charCodeAt(0))|0;return 'f'+x}}
function pedirAuth(o){S.modal={k:'auth',motivo:true,mot:'',...o};renderModal();setTimeout(()=>{const n=$(o.motivo===false?'#a-pin':'#a-mot');if(n)n.focus()},50)}
function mesaOcupada(n,exceptId){return S.cuentas.find(c=>c.tipo==='mesa'&&String(c.mesa)===String(n)&&c.id!==exceptId)}
function validOrden(o){
  if(o.tipo==='mesa'&&!String(o.mesa).trim()){toast('Elige la mesa');return false}
  if(o.tipo==='mesa'&&mesaOcupada(o.mesa,o.id)){toast('La Mesa '+o.mesa+' ya tiene una cuenta abierta. Tócala para abrirla.');return false}
  if(o.tipo==='pedido'&&!o.cliente.nombre.trim()){toast('Escribe el nombre del cliente');return false}
  return true;
}
async function saveCuenta(o){
  if(!o.folio)o.folio=nextFolio();
  o.guardada=true;
  try{await Store.set('cuentas',o.id,o)}catch(e){toast('No se guardó la cuenta: revisa la conexión');throw e}
}
function cobrar(){
  const m=S.modal,o=S.orden,t=totalOf(o);
  let pago={metodo:m.metodo};
  if(m.metodo==='efectivo'){
    const rec=m.recibido===''?t:+m.recibido;
    if(!(rec>=t)){toast('El efectivo recibido es menor al total');return}
    pago.recibido=r2(rec);pago.cambio=r2(rec-t);
  }
  if(!o.folio)o.folio=nextFolio();
  const venta={...clone(o),estado:'pagada',pagada:Date.now(),pago,total:t};
  venta.items.forEach(l=>{delete l.sel;delete l.presIdx});
  const tel=telKey(o.cliente.tel);let cliDoc=null;
  if(tel){
    const c=cliente(tel)||{},canje=venta.items.some(l=>l.regalo),cuenta=S.aj.fid&&venta.total>=(+S.aj.minSello||0);
    let sellos=+c.sellos||0;if(canje)sellos=0;else if(cuenta)sellos++;
    cliDoc={tel,nombre:(o.cliente.nombre||'').trim()||c.nombre||'',visitas:(+c.visitas||0)+1,sellos,canjes:(+c.canjes||0)+(canje?1:0),gastado:r2((+c.gastado||0)+t),ultima:venta.pagada,alta:c.alta||venta.pagada,promos:!!(o.cliente.promos??c.promos??false)};
    if(S.aj.fid)venta.fid={sellos,meta:+S.aj.meta||8,canje,cuenta};
  }
  const wasCuenta=o.guardada,id=o.id;
  // imprimir primero (dentro del toque), luego guardar
  const doc=buildTicket(venta,{cajon:m.metodo==='efectivo'&&S.aj.cajon});
  S.orden=newOrden();S.limpiar=false;
  openPrint('Ticket #'+venta.folio+(pago.cambio?` · Cambio ${money(pago.cambio)}`:''),doc);
  render();
  (async()=>{
    try{await Store.set('ventas',id,venta)}
    catch(e){const p=Pend.get();p.push({...venta,id});Pend.put(p);toast('Venta guardada en la tablet; se subirá después');render();return}
    if(wasCuenta){try{await Store.del('cuentas',id)}catch(e){}}
    if(cliDoc){try{await Store.set('clientes',cliDoc.tel,cliDoc)}catch(e){}}
  })();
}
async function retryPend(){
  const p=Pend.get(),left=[];
  for(const v of p){try{await Store.set('ventas',v.id,v);try{await Store.del('cuentas',v.id)}catch(e){}}catch(e){left.push(v)}}
  Pend.put(left);toast(left.length?`Faltan ${left.length} por subir`:'Ventas subidas');render();
}
async function exportCSV(){
  const [A,B]=rango(S.rango);
  const rows=[['folio','fecha','hora','tipo','mesa_o_cliente','forma_pago','estado','producto','presentacion','detalle','cantidad','importe','total_ticket']];
  S.ventas.filter(v=>v.pagada>=A&&v.pagada<B).sort((a,b)=>a.pagada-b.pagada).forEach(v=>v.items.forEach(l=>rows.push([v.folio,fecha(v.pagada),hora(v.pagada),TIPOS[v.tipo],v.tipo==='mesa'?v.mesa:v.cliente?.nombre||'',METODOS[v.pago?.metodo]||'',v.estado,l.n,l.pres||'',descLines(l).filter(x=>x!==l.pres).join(' | '),l.qty,lineTotal(l),v.total])));
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  saveFile(`ventas-guacamole-${S.rango}-${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv');
}

    case 'menu-save':{const M=S.menuDraft;
      M.prods.forEach(p=>{if(p.pres)p.pres=p.pres.filter(x=>x.n).map(x=>({n:x.n,p:+x.p||0}));else p.p=+p.p||0});
      Object.values(M.grupos).forEach(g=>g.o=g.o.map(x=>({n:x.n,p:+x.p||0})));
      try{await Store.set('config','menu',M);S.menu=clone(M);S.menuDraft=null;render();toast('Menú guardado')}catch(e){toast('No se guardó el menú: revisa la conexión')}
      break}
    case 'test-ticket':openPrint('Ticket de ejemplo',buildTicket(TK_SAMPLE(),{aj:S.ajDraft||S.aj}));break;
    case 'aj-save':try{const a2={...S.ajDraft,ancho:+S.ajDraft.ancho,comCopias:+S.ajDraft.comCopias||1,logoEsc:+S.ajDraft.logoEsc||60};if(a2.logoSrc&&(a2.ancho!==+S.aj.ancho||a2.logoEsc!==+S.aj.logoEsc||!a2.logo))a2.logo=await procLogo(a2.logoSrc,a2.ancho,a2.logoEsc);await Store.set('config','ajustes',a2);S.aj=a2;S.ajDraft=null;render();toast('Ajustes guardados')}catch(e){toast('No se guardaron los ajustes')}break;
    case 'test-print':{const a2=S.ajDraft||S.aj;const d=Doc(+a2.ancho||48).init().align('c').bold(1).size(1).line(a2.negocio).size(0).bold(0).line('Prueba de impresión').line(fecha(Date.now())+' '+hora(Date.now())).rule().align('l').lr('Izquierda','Derecha').line('Acentos: áéíóú ÁÉÍÓÚ ñ Ñ ¿¡').feed(3).cut();openPrint('Prueba de impresión',d);break}
    case 'test-cajon':openPrint('Prueba de cajón',Doc(48).init().drawer());break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.f){const o=S.orden;if(d.f==='envio'){o.envio=+t.value||0;const el=$('#cart-total');if(el)el.textContent=money(totalOf(o))}else setPath(o,d.f,t.value)}
  if(d.f&&d.f.startsWith('cliente.')){const o=S.orden;
    if(d.f==='cliente.tel'){const c=cliente(telKey(t.value));if(c&&!o.cliente.nombre){o.cliente.nombre=c.nombre||'';const n=$('#f-nom');if(n)n.value=o.cliente.nombre}}
    const f=$('#fid');if(f)f.innerHTML=fidHTML(o)}
  if(d.q){S.qCli=t.value;clearTimeout(S._qt);S._qt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#q-cli');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
  if(d.am&&S.modal)S.modal.mot=t.value;
  if(d.mf&&S.modal)S.modal[d.mf]=t.value;
  if(d.cf&&S.modal){S.modal[d.cf]=t.value;const t2=totalOf(S.orden),cam=r2((+t.value||0)-t2),el=$('#c-cam');if(el){el.textContent=t.value===''?money(0):money(cam);el.style.color=t.value===''?'var(--muted)':cam<0?'var(--ketchup)':'var(--pickle)'}}
  if(d.r){S[d.r]=t.value;
    const [hA,hB]=rango('hoy');const ef=r2(S.ventas.filter(v=>v.estado!=='anulada'&&v.pagada>=hA&&v.pagada<hB&&v.pago?.metodo==='efectivo').reduce((x,v)=>x+v.total,0));
    const esp=r2((+S.fondo||0)+ef+movNet()),el=$('#esperado'),df=$('#dif');if(el)el.textContent=money(esp);
    if(df){if(S.contado===''){df.textContent='—';df.style.color='var(--muted)'}else{const x=r2((+S.contado||0)-esp);df.textContent=(x>0?'+':'')+money(x);df.style.color=x<0?'var(--ketchup)':'var(--pickle)'}}}
  if(d.m&&S.menuDraft)setPath(S.menuDraft,d.m,t.value);
  if(d.a&&S.ajDraft){S.ajDraft[d.a]=t.value;clearTimeout(S._tk);S._tk=setTimeout(updTkPv,150)}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.mc&&S.menuDraft)setPath(S.menuDraft,d.mc,t.checked);
  if(d.ac&&S.ajDraft){S.ajDraft[d.ac]=t.checked;updTkPv()}
  if(d.a&&S.ajDraft&&t.tagName==='SELECT'){S.ajDraft[d.a]=t.value;if((d.a==='logoEsc'||d.a==='ancho')&&S.ajDraft.logoSrc){procLogo(S.ajDraft.logoSrc,S.ajDraft.ancho,S.ajDraft.logoEsc).then(l=>{S.ajDraft.logo=l;updTkPv()})}else updTkPv()}
  if(d.ck==='promos'&&S.orden)S.orden.cliente.promos=t.checked;
  if(d.f==='envio'&&S.view==='vender')render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal()});
document.addEventListener('change',async e=>{if(e.target.id!=='logo-file'||!S.ajDraft)return;const f=e.target.files[0];if(!f)return;
  try{const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const sm=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=rej;im.src=src});
    S.ajDraft.logoSrc=sm;S.ajDraft.logo=await procLogo(sm,S.ajDraft.ancho,S.ajDraft.logoEsc);S.ajDraft.logoOn=true;const cb=document.querySelector('[data-ac=logoOn]');if(cb)cb.checked=true;const lb=document.querySelector('label[for=logo-file]');if(lb)lb.textContent='Cambiar logo…';updTkPv();toast('Logo listo. Guarda los ajustes')}catch(err){toast('No se pudo leer esa imagen')}});
document.addEventListener('change',async e=>{if(e.target.id!=='rest-file')return;const f=e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.app!=='guacamole-pos'||!o.data)throw 0;S.restore=o;render()}catch(err){toast('Ese archivo no es un respaldo del punto de venta')}});

/* ===================== Arranque ===================== */
async function boot(){
  render();
  await Store.init();
  const onErr=()=>{};S.loaded=true;
  Store.watch('ventas',docs=>{S.ventas=docs;render()},onErr);
  Store.watch('cuentas',docs=>{S.cuentas=docs;render()},onErr);
  Store.watch('cortes',docs=>{S.cortes=docs;if(S.view==='reportes')render()},onErr);
  Store.watch('clientes',docs=>{S.clientes=docs;if(S.view==='clientes')render();const f=$('#fid');if(f&&S.orden)f.innerHTML=fidHTML(S.orden)},onErr);
  Store.watch('bitacora',docs=>{S.bit=docs;if(S.view==='reportes')render()},onErr);
  Store.watch('movimientos',docs=>{S.movs=docs;if(S.view==='caja'||S.view==='reportes')render()},onErr);
  Store.watch('config',docs=>{
    const mm=docs.find(d=>d.id==='menu');if(mm&&mm.prods){const c=clone(mm);delete c.id;S.menu=c}
    const aa=docs.find(d=>d.id==='ajustes');if(aa){const c={...aa};delete c.id;S.aj={...DEFAULT_AJ,...c}}
    if(!S.menu.cats.find(c=>c.id===S.cat))S.cat=S.menu.cats[0]?.id;
    render();
  },onErr);
  if(Pend.get().length)retryPend();
}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
